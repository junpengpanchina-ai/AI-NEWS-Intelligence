<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJ Intelligence V0.1</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="brand">PJ INTELLIGENCE V0.1</div>
    <div class="badge">LOCAL</div>
    <div class="status">
      <span>今日 <b id="stat-today">0</b></span>
      <span>高分 <b id="stat-high">0</b></span>
      <span>来源 <b id="stat-sources">0</b></span>
      <span class="badge">Manual Analyze</span>
    </div>
    <div id="job"></div>
    <button id="collect" type="button">立即采集</button>
  </header>
  <main>
    <section class="panel" id="radar">
      <h2>TREND RADAR</h2>
      <div id="radar-body"></div>
    </section>
    <section class="panel" id="hot">
      <h2>HOT NOW</h2>
      <div id="list"></div>
    </section>
    <section class="panel" id="signals">
      <h2>SIGNALS</h2>
      <div id="signal-body"></div>
    </section>
    <section class="panel" id="intel">
      <h2>INTELLIGENCE PANEL</h2>
      <div id="detail">选择一条资讯</div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
