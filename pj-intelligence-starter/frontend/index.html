<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJ Intelligence V0.5.4</title>
  <link rel="stylesheet" href="/styles.css?v=058">
</head>
<body data-screen="dashboard" data-focus="work">
  <header>
    <div class="brand">PJ INTELLIGENCE V0.5.4</div>
    <div class="badge">LOCAL</div>
    <nav class="switch" id="primary-nav">
      <button id="view-dashboard" class="on" type="button">Dashboard</button>
      <button id="view-opportunities" type="button">Opportunities</button>
      <button id="view-keywords" type="button">Keywords</button>
      <button id="view-competitors" type="button">Competitors</button>
      <button id="view-admin" type="button">Admin</button>
    </nav>
    <div id="job"></div>
  </header>
  <nav id="admin-nav" class="admin-nav" hidden>
    <button id="view-sources" type="button">Sources</button>
    <button id="view-imports" type="button">Data Imports</button>
    <button id="view-trace" type="button">API Trace</button>
    <button id="view-items" type="button">Items</button>
    <button id="view-events" type="button">Market Signals</button>
    <button id="build-events" type="button" hidden>构建市场信号</button>
    <button id="add-source" type="button" hidden>新增数据源</button>
    <button id="import-csv" type="button" hidden>导入 CSV</button>
    <button id="collect" type="button" hidden>立即采集</button>
  </nav>
  <main>
    <section id="cockpit"></section>
    <div id="workspace">
      <section class="panel" id="radar">
        <h2>TREND RADAR</h2>
        <div id="radar-body"></div>
      </section>
      <section class="panel" id="hot">
        <div class="hot-bar">
          <h2 id="list-title">LIST</h2>
          <button id="seed-keywords" type="button" hidden>初始化关键词池</button>
          <button id="add-competitor" type="button" hidden>新增竞品页面</button>
        </div>
        <div id="list"></div>
      </section>
      <section class="panel" id="signals">
        <h2>SIGNALS</h2>
        <div id="signal-body"></div>
      </section>
      <section class="panel" id="intel">
        <h2>INTELLIGENCE PANEL</h2>
        <div id="detail">选择一条资讯</div>
      </section>
    </div>
  </main>
  <script src="/app.js?v=058"></script>
</body>
</html>
