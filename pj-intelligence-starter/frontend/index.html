<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PJ Intelligence V0.5</title>
  <link rel="stylesheet" href="/styles.css?v=050">
</head>
<body>
  <header>
    <div class="brand">PJ INTELLIGENCE V0.5</div>
    <div class="badge">LOCAL</div>
    <div class="status">
      <span>今日 <b id="stat-today">-</b></span>
      <span>高分 <b id="stat-high">-</b></span>
      <span>来源 <b id="stat-sources">-</b></span>
      <span class="badge">Manual Analyze</span>
    </div>
    <div id="job"></div>
    <button id="api-trace" type="button">API Trace</button>
    <button id="collect" type="button">立即采集</button>
  </header>
  <main>
    <section class="panel" id="radar">
      <h2>TREND RADAR</h2>
      <div id="radar-body"></div>
    </section>
    <section class="panel" id="hot">
      <div class="hot-bar">
        <h2>HOT NOW</h2>
        <div class="switch">
          <button id="view-items" class="on" type="button">Items</button>
          <button id="view-events" type="button">Market Signals</button>
          <button id="view-keywords" type="button">Keywords</button>
          <button id="view-competitors" type="button">Competitors</button>
          <button id="view-opportunities" type="button">Opportunities</button>
        </div>
        <button id="build-events" type="button" hidden>构建市场信号</button>
        <button id="seed-keywords" type="button" hidden>初始化关键词池</button>
        <button id="add-competitor" type="button" hidden>新增竞品页面</button>
      </div>
      <div id="list"></div>
    </section>
    <section class="panel" id="signals">
      <h2>SIGNALS</h2>
      <div id="signal-body"></div>
    </section>
    <section class="panel" id="intel">
      <h2>INTELLIGENCE PANEL</h2>
      <div id="detail">选择一条资讯</div>
    </section>
  </main>
  <script src="/app.js?v=050"></script>
</body>
</html>
