services:
  app:
    build: ./backend
    ports:
      - "8765:8765"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      SERP_PROVIDER: ${SERP_PROVIDER:-manual_csv}
      SERPER_ENABLED: ${SERPER_ENABLED:-false}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_DAILY_LIMIT: ${SERPER_DAILY_LIMIT:-100}
      SERPER_BASE_URL: ${SERPER_BASE_URL:-https://google.serper.dev}
      SITEDATA_BRIDGE_URL: http://host.docker.internal:8791
